name: One-time MAAP image patch

on:
  push:
    paths:
      - '.github/workflows/one-time-maap-image-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace external MAAP images with local image directives
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('WhitePaper/use-cases-definition.md')
          text = path.read_text(encoding='utf-8')

          old = '''<img width="1000" height="650" alt="image" src="https://github.com/user-attachments/assets/4bc950b8-a91b-4d32-937c-907d230fa6c0" />

<img width="1000" height="350" alt="image" src="https://github.com/user-attachments/assets/a7dd75ee-e8ba-4312-9cb7-398869fa9409" />'''

          new = '''```{image} img/esa-nasa-maap-earthdata-1.png
:alt: ESA NASA MAAP and Earthdata information
:width: 90%
:class: image-spaced
```

```{image} img/esa-nasa-maap-earthdata-2.png
:alt: ESA NASA MAAP and Earthdata authentication information
:width: 90%
:class: image-spaced
```'''

          if old not in text:
              raise SystemExit('Target external MAAP image block not found')

          path.write_text(text.replace(old, new), encoding='utf-8')

          css_path = Path('WhitePaper/_static/custom.css')
          if css_path.exists():
              css = css_path.read_text(encoding='utf-8')
              css = css.replace('''

/* ESA/NASA MAAP images embedded as GitHub user attachments in use-cases-definition.md.
   These files currently have fixed HTML width and height attributes, which can distort them.
   Force responsive rendering and preserve each image intrinsic aspect ratio. */
img[src*="4bc950b8-a91b-4d32-937c-907d230fa6c0"],
img[src*="a7dd75ee-e8ba-4312-9cb7-398869fa9409"] {
  width: 100% !important;
  max-width: 1000px !important;
  height: auto !important;
  object-fit: contain !important;
}
''', '')
              css_path.write_text(css, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-maap-image-patch.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WhitePaper/use-cases-definition.md WhitePaper/_static/custom.css .github/workflows/one-time-maap-image-patch.yml
          git commit -m "Use local ESA MAAP images" || exit 0
          git push
